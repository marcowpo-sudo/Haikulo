<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haikulo - L'Arte Rotonda</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a1d2e">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Haikulo">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sakura-container"></div>

    <button id="share-icon-btn" onclick="condividiTutto()" title="Condividi immagine dell'Haikulo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 16.08C17.24 16.08 16.56 16.38 16.04 16.85L8.91 12.7C8.96 12.47 9 12.24 9 12C9 11.76 8.96 11.53 8.91 11.3L15.96 7.19C16.5 7.69 17.21 8 18 8C19.66 8 21 6.66 21 5C21 3.34 19.66 2 18 2C16.34 2 15 3.34 15 5C15 5.24 15.04 5.47 15.09 5.7L8.04 9.81C7.5 9.31 6.79 9 6 9C4.34 9 3 10.34 3 12C3 13.66 4.34 15 6 15C6.79 15 7.5 14.69 8.04 14.19L15.16 18.35C15.11 18.53 15.08 18.72 15.08 18.92C15.08 20.53 16.39 21.83 18 21.83C19.61 21.83 20.92 20.53 20.92 18.92C20.92 17.31 19.61 16.08 18 16.08Z"/>
        </svg>
    </button>

    <div class="haiku-main-wrapper" id="haiku-main-wrapper">
        <div class="header-minimal">
            <h1>Haikulo</h1>
            <div class="subtitle">L'arte prende forma, rotonda.</div>
        </div>
        
        <div class="haiku-display" id="haikuBox">
            </div>

        <div class="footer-actions">
            <button class="btn-genera-fiore" onclick="generaHaikulo()" title="Genera nuova poesia">
                <span class="flower-scale-wrapper">
                    <span class="flower-icon">✿</span>
                </span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registrato! 😎', reg))
            .catch(err => console.log('Errore Service Worker', err));
        });
      }
    </script>
</body>
</html>
